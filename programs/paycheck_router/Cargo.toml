[package]
name = "paycheck_router"
version = "0.1.0"
description = "Routes each paycheck's USDC into tokenized stocks under an onchain price guard"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/winsznx/paycheck-router"

[lib]
crate-type = ["cdylib", "lib"]
name = "paycheck_router"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.0.2", default-features = false, features = ["token", "token_2022", "token_2022_extensions", "associated_token"] }
pyth-solana-receiver-sdk = "=2.0.0"
solana-security-txt = "=1.1.3"
solana-instructions-sysvar = "=3.0.1"

[dev-dependencies]
bincode = "=1.3.3"
litesvm = { version = "=0.10.0", features = ["precompiles"] }
proptest = "=1.11.0"
serde_json = "=1.0.151"
solana-account = "=3.4.0"
solana-keypair = "=3.1.2"
solana-message = "=3.1.0"
solana-signer = "=3.0.1"
solana-transaction = "=3.1.0"
test_swap = { path = "test-programs/test_swap", features = ["no-entrypoint"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
