[extend]
useDefault = true

# Recorded upstream responses and evidence bundles name Solana accounts under keys ending in
# "Key": Jupiter's route plans ("ammKey") and v0 transactions' lookup tables ("accountKey").
# These are public addresses.
[[allowlists]]
description = "Public Solana addresses under ammKey and accountKey"
regexTarget = "line"
regexes = ['''"(ammKey|accountKey)":\s*"[1-9A-HJ-NP-Za-km-z]{32,44}"''']
