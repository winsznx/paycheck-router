[workspace]
members = ["programs/*", "programs/paycheck_router/test-programs/*"]
exclude = ["scripts/day-one/cpi-probe"]
resolver = "2"

[profile.release]
opt-level = "s"
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
